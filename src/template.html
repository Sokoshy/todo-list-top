<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <!-- Sidebar: projects -->
    <aside class="sidebar">
      <h1 class="app-title">Todo List</h1>

      <form class="project-form" data-project-form>
        <input type="text" name="projectName" placeholder="Nouveau projet" required>
        <button type="submit">Ajouter</button>
      </form>

      <ul class="project-list" data-project-list></ul>
    </aside>

    <!-- Main: todos of the selected project -->
    <main class="main">
      <header class="main-header">
        <h2 data-current-project>Default</h2>
        <p data-todo-count></p>
      </header>

      <form class="todo-form" data-todo-form>
        <input type="text" name="title" placeholder="Titre de la todo" required>
<input type="text" name="description" placeholder="Description">
        <input type="text" name="note" placeholder="Note">
        <input type="date" name="dueDate">
        <select name="priority">
          <option value="low">Basse</option>
          <option value="medium" selected>Moyenne</option>
          <option value="high">Haute</option>
        </select>
        <button type="submit">Ajouter la todo</button>
      </form>

      <ul class="todo-list" data-todo-list></ul>
    </main>
  </div>

  <!-- Todo detail -->
<dialog class="todo-dialog" data-todo-dialog>
    <section class="dialog-detail">
      <h3 data-dialog-title></h3>
      <p data-dialog-description></p>
      <p data-dialog-due-date></p>
      <p data-dialog-priority></p>
      <p data-dialog-note></p>
    </section>

    <section class="dialog-checklist">
      <h4>Checklist</h4>
      <ul data-checklist-list></ul>
      <form class="checklist-form" data-checklist-form>
        <input type="text" name="checklistItem" placeholder="Nouvel item" required>
        <button type="submit">Ajouter</button>
      </form>
    </section>

    <form class="dialog-edit" data-edit-form>
      <h4>Modifier</h4>
      <input type="text" name="title" data-edit-title required>
      <input type="text" name="description" data-edit-description>
      <input type="text" name="note" data-edit-note>
      <input type="date" name="dueDate" data-edit-due-date>
      <select name="priority" data-edit-priority>
        <option value="low">Basse</option>
        <option value="medium">Moyenne</option>
        <option value="high">Haute</option>
      </select>
      <button type="submit">Enregistrer</button>
    </form>

    <div class="dialog-actions">
      <button type="button" class="delete-todo" data-action="delete">Supprimer</button>
      <form method="dialog">
        <button value="close">Fermer</button>
      </form>
    </div>
  </dialog>
</body>
</html>
